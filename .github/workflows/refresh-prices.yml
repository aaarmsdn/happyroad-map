name: Refresh apartment prices

on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-prices.mjs"
      - "config/price-name-aliases.json"
      - ".github/workflows/refresh-prices.yml"
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Refresh official transaction prices
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          MOLIT_MONTHS: "12"
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "::error::MOLIT_API_KEY repository secret is missing."
            exit 1
          fi
          status=1
          for attempt in 1 2 3; do
            set +e
            output=$(npm run prices:refresh 2>&1)
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            reason=$(printf '%s\n' "$output" | grep -E 'Error:' | tail -1 || true)
            echo "Refresh attempt $attempt failed: ${reason:-unknown error}"
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          if [ "$status" -ne 0 ]; then
            reason=$(printf '%s\n' "$output" | grep -E 'Error:' | tail -1 || true)
            echo "::error::${reason:-Apartment price refresh failed.}"
            exit "$status"
          fi
          printf '%s\n' "$output"
      - name: Validate generated data
        run: npm run check
      - name: Commit changed prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/apartments.json public/data/prices.json
          git diff --cached --quiet || git commit -m "data: refresh apartment prices"
          git push
  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Validate deploy data
        run: npm run check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
