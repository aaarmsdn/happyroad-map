name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Run core tests
        run: node --test scripts/browser-route-mock.test.mjs scripts/commute-routing.test.mjs scripts/filter-logic.test.mjs scripts/map-cluster.test.mjs scripts/map-view.test.mjs
      - name: Run data tests
        run: node --test scripts/price-refresh.test.mjs scripts/region-match.test.mjs scripts/route-view-data.test.mjs scripts/school-data.test.mjs scripts/ui-contract.test.mjs scripts/ui-data.test.mjs
      - name: Run Worker tests
        run: node --test scripts/worker-route-geometry.test.mjs scripts/worker.test.mjs
      - name: Run browser tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test scripts/price-metric.browser.test.mjs
      - name: Validate deploy data
        run: npm run check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
