<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'">
  <meta name="commute-api-base" content="https://happyroad-routing.aaarmsdn-happyroad.workers.dev">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="이동 경로와 주변 아파트를 한 지도에서 비교합니다.">
  <title>하이로드</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/app-icon.png">
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./styles.css?v=46">
</head>
<body>
  <main class="app-shell">
    <div id="map" aria-label="셔틀과 아파트 지도"></div>

    <header class="app-bar">
      <div class="app-actions">
        <button class="commute-launch" id="commuteButton" type="button" aria-label="길찾기" title="길찾기">
          <i data-lucide="navigation"></i>
          <span>길찾기</span>
        </button>
        <button class="icon-button" id="searchButton" type="button" aria-label="검색" title="검색">
          <i data-lucide="search"></i>
        </button>
        <button class="icon-button" id="locateButton" type="button" aria-label="현재 위치" title="현재 위치">
          <i data-lucide="locate-fixed"></i>
        </button>
        <button class="icon-button mobile-only" id="panelButton" type="button" aria-label="필터 열기" title="필터">
          <i data-lucide="sliders-horizontal"></i>
        </button>
      </div>
    </header>

    <div class="map-key" aria-label="지도 범례">
      <span class="stop-key"><i data-lucide="bus-front"></i>정류장</span>
      <span class="apartment-key"><i data-lucide="building-2"></i><span id="apartmentColorLabel">아파트 평당가</span></span>
      <span class="school-key" id="schoolKey" hidden><i>초</i><i>중</i><i>고</i>학교</span>
      <span class="price-key" id="apartmentColorScale" aria-label="평당 2천5백만원 미만부터 8천만원 이상"><b>낮음</b><i></i><i></i><i></i><i></i><i></i><b>높음</b></span>
    </div>

    <section class="control-panel" id="controlPanel" aria-label="지도 필터">
      <div class="panel-handle mobile-only" aria-hidden="true"></div>
      <div class="panel-heading">
        <div class="segmented-control" role="tablist" aria-label="필터 종류">
          <button class="segment active" type="button" role="tab" aria-selected="true" data-tab="shuttle">셔틀</button>
          <button class="segment" type="button" role="tab" aria-selected="false" data-tab="apartment">아파트</button>
        </div>
        <button class="icon-button mobile-only" id="panelCloseButton" type="button" aria-label="필터 닫기">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="filter-view active" data-view="shuttle">
        <div class="filter-section">
          <span class="section-label">운행 구분</span>
          <div class="chip-row" id="categoryChips">
            <button class="chip active" type="button" data-category="전체">전체</button>
            <button class="chip" type="button" data-category="출근">출근</button>
            <button class="chip" type="button" data-category="퇴근">퇴근</button>
            <button class="chip" type="button" data-category="기타셔틀">기타</button>
            <button class="chip" type="button" data-category="사내셔틀">사내</button>
          </div>
        </div>
        <label class="field">
          <span>노선 검색</span>
          <span class="input-shell"><i data-lucide="route"></i><input id="routeQuery" type="search" placeholder="노선명 또는 정류장"></span>
        </label>
        <label class="field">
          <span>노선</span>
          <select id="routeSelect"><option value="전체">전체 노선</option></select>
        </label>
        <div class="split-fields">
          <label class="field">
            <span>운행 형태</span>
            <select id="routeTypeSelect"><option value="전체">전체</option></select>
          </label>
          <label class="field">
            <span>출발 시간</span>
            <select id="startHourSelect"><option value="">전체</option></select>
          </label>
        </div>
        <label class="toggle-row">
          <span><b>정류장 표시</b><small id="stopCount">0개</small></span>
          <input id="showStops" type="checkbox" checked>
        </label>
        <p class="data-freshness" id="shuttleFreshness">셔틀 데이터 업데이트 확인 중</p>
      </div>

      <div class="filter-view" data-view="apartment">
        <div class="filter-section">
          <span class="section-label">전용면적</span>
          <div class="chip-row" id="areaChips">
            <button class="chip active" type="button" data-area="전체">전체</button>
            <button class="chip" type="button" data-area="59-69">59~69㎡</button>
            <button class="chip" type="button" data-area="70-79">70~79㎡</button>
            <button class="chip" type="button" data-area="80-89">80~89㎡</button>
            <button class="chip" type="button" data-area="90-99">90~99㎡</button>
            <button class="chip" type="button" data-area="100-109">100~109㎡</button>
            <button class="chip" type="button" data-area="110-120">110~120㎡</button>
          </div>
        </div>
        <div class="filter-section">
          <span class="section-label">대표 실거래가</span>
          <div class="segmented-control price-metric-control" id="priceMetricControl" role="group" aria-label="대표 실거래가 기준">
            <button class="segment active" type="button" aria-pressed="true" data-price-metric="max">최고값</button>
            <button class="segment" type="button" aria-pressed="false" data-price-metric="average">평균값</button>
            <button class="segment" type="button" aria-pressed="false" data-price-metric="min">최저값</button>
          </div>
        </div>
        <label class="field range-field">
          <span><b>정류장 거리</b><output id="distanceOutput">1.5 km</output></span>
          <input id="distanceRange" type="range" min="0.2" max="1.5" step="0.1" value="1.5">
        </label>
        <label class="field">
          <span>최소 세대수</span>
          <input id="householdMin" type="number" min="0" step="100" value="200">
        </label>
        <label class="field range-field">
          <span><b>최대 출근시간</b><output id="inboundTimeOutput">제한 없음</output></span>
          <input id="inboundTimeMax" type="range" min="5" max="180" step="5" value="180">
        </label>
        <label class="field range-field">
          <span><b>최대 퇴근시간</b><output id="outboundTimeOutput">제한 없음</output></span>
          <input id="outboundTimeMax" type="range" min="5" max="180" step="5" value="180">
        </label>
        <label class="toggle-row">
          <span><b>시간에 도보 포함</b><small>아파트 ↔ 정류장 이동</small></span>
          <input id="includeWalking" type="checkbox" checked>
        </label>
        <label class="toggle-row">
          <span><b>아파트 표시</b><small id="apartmentCount">0개</small></span>
          <input id="showApartments" type="checkbox" checked>
        </label>
        <label class="toggle-row">
          <span><b>학교 표시</b><small id="schoolCount">0개</small></span>
          <input id="showSchools" type="checkbox">
        </label>
        <div class="filter-section">
          <span class="section-label">아파트 색상</span>
          <div class="segmented-control price-metric-control" id="apartmentColorControl" role="group" aria-label="아파트 색상 기준">
            <button class="segment active" type="button" aria-pressed="true" data-apartment-color="price">평당가</button>
            <button class="segment" type="button" aria-pressed="false" data-apartment-color="commute">왕복시간</button>
            <button class="segment" type="button" aria-pressed="false" data-apartment-color="none">단색</button>
          </div>
        </div>
        <p class="data-freshness" id="apartmentFreshness">가격 데이터 업데이트 확인 중</p>
      </div>

      <div class="panel-footer">
        <button class="text-button" id="resetButton" type="button"><i data-lucide="rotate-ccw"></i>초기화</button>
        <span id="resultSummary">준비 중</span>
      </div>
    </section>

    <section class="detail-panel" id="detailPanel" aria-live="polite" aria-label="선택 상세" aria-hidden="true" inert>
      <button class="icon-button detail-close" id="detailCloseButton" type="button" aria-label="상세 닫기"><i data-lucide="x"></i></button>
      <div id="detailContent"></div>
    </section>

    <section class="commute-panel" id="commutePanel" role="dialog" aria-modal="false" aria-label="출퇴근 길찾기" aria-hidden="true" data-stage="search" inert>
      <div class="panel-handle mobile-only" aria-hidden="true"></div>
      <div class="commute-heading">
        <button class="icon-button commute-stage-back" id="commuteStageBack" type="button" aria-label="검색 조건으로 돌아가기" hidden><i data-lucide="arrow-left"></i></button>
        <div>
          <h2 id="commuteStageTitle">출퇴근 길찾기</h2>
          <p id="commuteStageSubtitle">선택 위치와 회사를 셔틀로 연결합니다.</p>
        </div>
        <button class="icon-button" id="commuteCloseButton" type="button" aria-label="길찾기 닫기"><i data-lucide="x"></i></button>
      </div>
      <div class="commute-search-view" id="commuteSearchView">
        <div class="segmented-control commute-mode" id="commuteMode" role="group" aria-label="길찾기 방향">
          <button class="segment active" type="button" data-commute-mode="to-company" aria-pressed="true">회사 가기</button>
          <button class="segment" type="button" data-commute-mode="from-company" aria-pressed="false">퇴근하기</button>
        </div>
        <label class="field">
          <span>출발 일시</span>
          <input id="commuteDepartureAt" type="datetime-local">
        </label>
        <form class="commute-search" id="commutePlaceForm">
          <label class="field">
            <span>선택 위치</span>
            <span class="input-shell"><i data-lucide="map-pin"></i><input id="commutePlaceQuery" type="search" placeholder="장소 또는 주소 검색" autocomplete="off"></span>
          </label>
          <button class="icon-button commute-search-button" type="submit" aria-label="장소 검색"><i data-lucide="search"></i></button>
        </form>
        <div class="commute-location-actions">
          <button class="secondary-command" id="commuteUseCurrentLocation" type="button"><i data-lucide="locate-fixed"></i>현재 위치 사용</button>
          <button class="secondary-command" id="commutePickOnMap" type="button"><i data-lucide="map-pin"></i>지도에서 선택</button>
        </div>
        <p class="commute-privacy">현재 위치와 검색 주소는 경로 계산에만 사용되며 앱에 저장되지 않습니다.</p>
        <p class="commute-point" id="commutePointLabel">위치를 선택해 주세요.</p>
        <div class="commute-place-results" id="commutePlaceResults"></div>
        <button class="primary-command" id="commuteSearchButton" type="button"><i data-lucide="route"></i>경로 찾기</button>
      </div>
      <div class="commute-results" id="commuteResults" aria-live="polite" hidden></div>
    </section>

    <section class="search-dialog" id="searchDialog" role="dialog" aria-modal="true" aria-label="통합 검색" aria-hidden="true" inert>
      <div class="search-box">
        <button class="icon-button" id="searchCloseButton" type="button" aria-label="검색 닫기"><i data-lucide="arrow-left"></i></button>
        <input id="globalSearch" type="search" aria-label="통합 검색" placeholder="정류장, 노선, 아파트 검색" autocomplete="off">
      </div>
      <div class="search-results" id="searchResults"></div>
    </section>

    <div class="loading-screen" id="loadingScreen">
      <img src="./icons/app-icon.png" alt="" class="loading-icon">
      <strong>지도 준비 중</strong>
      <span id="loadingText">셔틀 데이터 확인 중</span>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <script src="./vendor/lucide.js"></script>
  <script src="./vendor/leaflet.js"></script>
  <script src="./data/shuttle-data.js"></script>
  <script src="./data/shuttle-time-estimates.js"></script>
  <script type="module" src="./app-main.js?v=157"></script>
</body>
</html>
